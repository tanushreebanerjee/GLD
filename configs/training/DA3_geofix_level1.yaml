# GeoFix session 8 -- finetune the released level-1 checkpoint to repair 3DGS
# artifact renders, conditioned on our uncertainty masks.
#
# Derived from DA3_level1.yaml. Everything not commented below is unchanged from
# it on purpose: this is a FINETUNE, and a silently different architecture or
# transport would make the result incomparable to the released model.
#
#   torchrun --standalone --nnodes=1 --nproc_per_node=1 src/train_multiview_da3.py \
#     --config configs/training/DA3_geofix_level1.yaml \
#     --data-path assets --results-dir results/geofix/level1 \
#     --precision bf16 --pretrained <released GLD level-1 ckpt>
#
# `--pretrained` (model weights only), NOT `--ckpt` (weights+optimizer+step): we
# are starting a new run from a released checkpoint, not resuming theirs. Hard
# rule 2 forbids stage-2 training FROM SCRATCH; finetuning from the release is
# the plan and always was.

stage_1:
  target: stage1.rae_da3.RAE_DA3
  params:
    encoder_pretrained_path: 'depth-anything/DA3-Base'
    encoder_input_size: 504
    encoder_type: 'DA3EncoderDirect'
    decoder_config_path: 'configs/decoder/ViTXL'
    da3_weights_path: 'pretrained_models/da3/model.safetensors'
    mae_weight: './pretrained_models/mae_decoder.pt'
    noise_tau: 0.0
    reshape_to_2d: true
    # HARD RULE 5. Our inputs are off-distribution, and the measurement
    # (RESULTS.md, 2026-08-16) says mostly because they are DL3DV rather than
    # because they carry artifacts: at level 1 the dataset term is |z|mean 0.200
    # against 0.136 for artifacts and 0.014 for resolution. So the released
    # RE10K-derived file is wrong for us even setting artifacts aside.
    # Leg C = DL3DV + artifacts + 504 + ImageNet normalisation.
    normalization_stat_path: '/fs/nexus-projects/Generative_Detection/workspace/research/uncertainty-guided-diffusion/geofix/eval/feature_stats/legs/dl3dv_art_504__imagenet/normalization_stats_level1.pt'

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    patch_size: 1
    in_channels: 1536
    hidden_size: [768, 2048]
    depth: [28, 6]
    num_heads: [16, 16]
    mlp_ratio: 4.0
    use_qknorm: false
    use_swiglu: true
    use_rope: false
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: false
    use_prope: true
    architecture_mode: "new"
    cfg_mode: "new"
    cam_input_size: 504
    cam_patch_size: 14
    level: 1
    predict_cls: false
    is_concat_mode: true

# =============================================================================
# GeoFix conditioning -- the two slots that already exist at the right shape
# (docs/ARCH_NOTES.md, "two conditioning slots that need no widening").
#
# Neither needs the `2C -> 2C + n_mask` embedder widening, so neither can be
# confounded with "my channel surgery perturbed a 175k-iteration checkpoint".
# The ablation ladder is exactly these two booleans over one code path.
#
#   cond_artifact=F mask_in_camera=F   stock GLD -- pure generation, the
#                                      MECHANISM baseline (6.5's "arm A")
#   cond_artifact=T mask_in_camera=F   refinement WITHOUT the mask; the honest
#                                      baseline for "does the mask add anything"
#   cond_artifact=T mask_in_camera=T   GeoFix proper                <- this file
#   cond_artifact=F mask_in_camera=T   mask with nothing to preserve; diagnostic
#                                      only, see the note in prepare_data
# =============================================================================
geofix:
  # Fill latents_cond[:, cond_num:] -- which stock GLD leaves as ZEROS -- with
  # features of the 3DGS render. In session 6.5 the render never entered the
  # network at all; it was only a sampling-time overwrite of x_t. This is route
  # (a) conditioning through a pathway that already exists at full C width.
  cond_artifact: true

  # Grade camera-embedding channel 0 by M_edit on the target half instead of the
  # constant 1.0 it carries today. Polarity already agrees (channel 0 = 1 means
  # "target, generate it"; M_edit = 1 means "repair here") so this is the one
  # mask in the project that enters with NO sign flip -- hard rule 7 satisfied by
  # construction rather than by a correction. CFG preserves it: the uncond branch
  # zeroes camera channels 1: and keeps 0.
  mask_in_camera: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'uniform'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

training:
  camera_drop: 0.1
  global_seed: 0
  epochs: 1000000
  # One 8-view sample per step at 504x504. The released run used 7 on 8xB200;
  # a single A6000 (48G) does not have that headroom. Raise grad_accum_steps
  # rather than global_batch_size if a larger effective batch is wanted.
  global_batch_size: 1
  grad_accum_steps: 4
  ema_decay: 0.9995
  num_workers: 4
  log_every: 10
  # 5e-5 is the released FROM-SCRATCH rate. This is a finetune of a converged
  # 175k-iteration checkpoint on 269 samples, where that rate would move the
  # weights fast enough to lose the prior we are finetuning FOR. Deliberately
  # conservative; it is a knob, not a finding.
  base_lr: 1e-5
  final_lr: 1e-5
  beta: [0.9, 0.95]
  wd: 0.0
  schedule_type: 'constant'
  clip_grad: 1.0

validation:
  # 194 held-out samples at batch 1. Validation here is a training-time sanity
  # signal only -- the REPORTED holdout numbers come from a separate scoring
  # pass (docs/SESSION_8.md), paired per scene, on PSNR and LPIPS and a
  # high-frequency measure, never on PSNR alone.
  val_num_batches: 20
  batch_size: 1
  validation_mode: 'propagation_0'
  ckpt_every: 500
  sample_every: 500
  num_views: 8
  # MUST equal the training cond_num. The manifest PLACED the clean references
  # in [0, 4); the released config's 1 would read three renders as references.
  cond_num: 4
  test_baseline: 25
  guidance:
    method: 'cfg'
    scale: 1.5
    t_min: 0.0
    t_max: 1.0

dataset:
  name: geofix

  # Absolute: training runs from the GLD fork worktree, not from geofix/.
  manifest: /fs/nexus-projects/Generative_Detection/workspace/research/uncertainty-guided-diffusion/geofix/eval/train/manifest_masked_exclude.json
  # The frozen holdout, it_03000 only. Shares 0 splits AND 0 (level, scene, run)
  # reconstructions with the training manifest.
  val_manifest: /fs/nexus-projects/Generative_Detection/workspace/research/uncertainty-guided-diffusion/geofix/eval/train/manifest_holdout_it03000.json

  # Mask planes stacked in order; must match what the manifest recorded.
  mask_types: [oracle_lpips]
  token_grid: 36
  # Contrast exponent on the POOLED mask. 1.0 = untouched. The blend's optimum
  # was a mask AREA of ~0.45, which on this data needs an exponent near 2.0
  # (1.0 -> 0.632, 1.5 -> 0.523, 2.0 -> 0.438) -- NOT gamma 0.45, which would
  # raise the area to ~0.79. gamma is monotone so it cannot reorder tokens and a
  # trained network can undo it. Do not re-tune it on blend PSNR.
  gamma: 1.0
  pooling: max

  skip_bad_poses: true
  max_translation_norm: 100

  # Single resolution. Hard rule 3: rendered natively at 504, never resized.
  image_size: [[504, 504]]

  num_views: 8
  # FIXED at 4, not the released "1-4" range. The manifest places exactly 4 clean
  # photographs in [0, 4); a per-batch random cond_num would slide that boundary
  # and feed renders into reference slots.
  cond_num: 4
  # prefix, never random/interpolate -- those also CHOOSE which views are
  # references, which would defeat the placement above.
  ref_view_sampling: prefix
  normalize_pose: true
  camera_mode: plucker

misc:
